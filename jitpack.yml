# JitPack's default JDK 8 does not support maven.compiler.release, and its preinstalled Maven is older
# than the 3.6.3 that the build plugins require. The wrapper downloads the Maven version pinned in
# .mvn/wrapper/maven-wrapper.properties. Bytecode still targets Java 8.
jdk:
  - openjdk17
install:
  - bash ./mvnw -B clean install -DskipTests
